[package]
name = "pdfreader"
version = "0.1.0"
description = "A focused desktop workspace for reading, annotating, and converting PDFs"
authors = ["PDFreader"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "pdfreader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
pdfium-render = { version = "0.9.5", features = ["pdfium_8125", "image_latest"] }
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Storage_FileSystem", "Win32_Foundation"] }
windows = { version = "0.61", features = ["Foundation", "Graphics_Imaging", "Media_Ocr", "Storage_Streams", "Globalization", "Win32_System_WinRT"] }
windows-future = { version = "0.2.1", features = ["std"] }
pollster = "0.4"
