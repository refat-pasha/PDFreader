name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dotnet:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build dotnet/PDFreader.Tests
      # In-process xUnit runner (no vstest testhost needed)
      - run: dotnet exec dotnet/PDFreader.Tests/bin/Debug/net10.0/PDFreader.Tests.dll
